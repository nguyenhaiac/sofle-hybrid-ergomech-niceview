# Pointing support: the trackpad on this side is proxied to the central via the
# input split device.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and
# the user experience is much better to not have the keyboard go into deep sleep
# (i.e. having to reconnect to bluetooth).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Shorten the idle timeout (default is 30000) so the trackpad spends more time
# in its low-power state. A key press within the last 30s suppresses this.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
